name: Update Salesforce Record From Event

on:
  repository_dispatch:
    types:
      - salesforce-record-update
  workflow_dispatch:
    inputs:
      object_api_name:
        description: Salesforce object API name (for example Account)
        required: true
        type: string
      record_id:
        description: Salesforce record id to update
        required: true
        type: string
      fields_json:
        description: JSON object of fields to update
        required: true
        type: string

jobs:
  update-salesforce-record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update Salesforce record
        env:
          SF_LOGIN_URL: ${{ secrets.SF_LOGIN_URL }}
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_CLIENT_SECRET: ${{ secrets.SF_CLIENT_SECRET }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
          SF_SECURITY_TOKEN: ${{ secrets.SF_SECURITY_TOKEN }}
          SF_API_VERSION: ${{ vars.SF_API_VERSION }}
        run: python scripts/update_salesforce_record.py
